<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WDD 131 - Dynamic Web Fundamentals - Product Review Form</title>
    <meta name="description" content="Product Review">
    <meta name="author" content="Helaman Franco">
    <link rel="stylesheet" href="styles/form.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>

<body>
    <header>
            <h1>Product Review</h1>
    </header>

    <main>
        <form action="review.html" method="get">
            <fieldset>
                  <legend>
                        Product Name
                    </legend>
                <label>
                    <select name="product" id="product" required>
                        <option value="" disabled selected hidden>Select a Product...</option>
                    </select>
                </label>
            </fieldset>

            <fieldset class="overall">
                <legend>
                    Overall Rating
                </legend>
                <label class="rating">
                    <span>☆</span>
                    <input type="radio" name="rate" id="1" value="1" required>
                </label>
                <label class="rating">
                    <span>☆☆</span>
                    <input type="radio" name="rate" id="2"  value="2">
                </label>
                <label class="rating">
                    <span>☆☆☆</span>
                    <input type="radio" name="rate" id="3" value="3">
                </label>
                <label class="rating">
                    <span><span>☆☆☆☆</span></span>
                    <input type="radio" name="rate" id="4" value="4">
                </label>
                <label class="rating">
                    <span>☆☆☆☆☆</span>
                    <input type="radio" name="rate" id="5" value="5">
                </label>
            </fieldset>

            <fieldset>
                <legend>
                    Date of Installation
                </legend>
                <label><input type="date" name="date" id="date" required>
                </label>
            </fieldset>
            
            <fieldset class="features">
                <legend>
                Which features did you find useful in the product?
                </legend>
                <span>
                    (Check all that apply)
                </span>
                <label>
                    <input type="checkbox" name="durability" value="yes" id="durability">Durability
                </label>
                <label>
                    <input type="checkbox" name="easeuse" 
                    id="easeuse" value="yes">Ease of Use
                </label>
                <label>
                    <input type="checkbox" name="performance" id="performance" value="yes">Performance
                </label>
                <label>
                    <input type="checkbox" name="design" id="design" value="yes">Design
                </label>
                </fieldset>

            <fieldset class="review">
                <legend>
                    Written Review
                        <span class="span">
                            (Optional)
                        </span>
                </legend>
                <label>
                    <textarea name="review" id="review"></textarea>
                </label>
            </fieldset>

            <fieldset>
                <legend>
                    Your Name
                    <span class="span">
                        (Optional)
                    </span>
                </legend>
                <label>
                    <input type="text" name="review" id="name">
                </label>
            </fieldset>

            <input type="submit" value="Post Review">
        </form>
    </main>

    <footer>
        <p id="year"></p>
        <p><span id="lastMod">Last Modification: </span></p>
    </footer>

    <script src="scripts/form.js" defer></script>
</body>
</html>
